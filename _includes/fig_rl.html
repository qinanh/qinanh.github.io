{%- comment -%} 配图一：policy 提候选 → 物理仿真打分 → reward 回流更新 policy，
   上位三个站点组成一个闭环；下位虚线框是每一步的推理链。

   网格：左右各留 22，上 26 下 14；三个盒子同高、上沿对齐，箭头长度一致，
   全部走在留白里，所以没有哪条线会插进图形或压住文字。 {%- endcomment -%}
