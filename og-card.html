<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f4f4f1;font-family:'Nunito',sans-serif;color:#2b3138;
 position:relative;overflow:hidden;display:flex;align-items:center;padding:0 74px;gap:52px}
body::before{content:"";position:absolute;inset:0;
 background-image:linear-gradient(to right,rgba(90,101,112,.12) 1px,transparent 1px),
                  linear-gradient(to bottom,rgba(90,101,112,.12) 1px,transparent 1px);
 background-size:34px 34px}
.l{position:relative;flex:1}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:82px;line-height:1;letter-spacing:-.02em;
 display:inline-block;transform:rotate(-1deg);position:relative}
h1 .sw{position:absolute;left:-8px;right:-12px;bottom:.1em;height:.32em;background:rgba(176,125,30,.26);border-radius:4px;z-index:-1;transform:rotate(.8deg)}
.r{font-family:'Kalam',cursive;font-size:31px;color:#26507a;margin-top:14px;transform:rotate(-.6deg)}
p{font-size:25px;line-height:1.5;color:#4d565f;margin-top:22px;max-width:24ch}
.tags{display:flex;gap:11px;margin-top:26px}
.tag{font-family:'Fredoka',sans-serif;font-size:19px;padding:5px 16px;border:2.4px solid #2b3138;
 border-radius:999px;background:#fff;box-shadow:3px 4px 0 rgba(43,49,56,.18)}
.tag:nth-child(2){transform:rotate(-1.5deg)} .tag:nth-child(3){transform:rotate(1.2deg)}
.pics{position:relative;width:392px;height:392px;flex:none}
.pic{position:absolute;width:200px;height:200px;border:3.4px solid #2b3138;border-radius:22px;
 overflow:hidden;background:#fff;box-shadow:6px 8px 0 rgba(43,49,56,.17);display:flex;align-items:center;justify-content:center;padding:8px}
.pic img{width:100%;height:100%;object-fit:contain}
.p1{left:0;top:6px;transform:rotate(-5deg);background:#f1f5f9}
.p2{right:0;top:52px;transform:rotate(4.5deg);background:#faf2ef}
.p3{left:96px;bottom:0;transform:rotate(-1.5deg);background:#eff5f4}
</style></head><body>
<div class="l">
  <h1>Qinan Huang<span class="sw"></span></h1>
  <div class="r">Amanchukwu Lab &middot; UChicago PME</div>
  <p>Simulation, quantum chemistry and generative models for lithium&#8209;metal electrolytes.</p>
  <div class="tags"><span class="tag">MD</span><span class="tag">DFT</span><span class="tag">diffusion models</span></div>
</div>
<div class="pics">
  <div class="pic p1"><img src="/assets/img/md_box_cg.svg"></div>
  <div class="pic p2"><img src="/assets/img/li_solvation_shell.svg"></div>
  <div class="pic p3"><img src="/assets/img/li_field_motif.png"></div>
</div>
</body></html>
